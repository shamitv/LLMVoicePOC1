[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-poc-qwen3"
version = "0.1.0"
description = "Voice POC backend package for Qwen-3 integration"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "requests",
  "aiohttp",
  "openai",
]

[project.urls]
homepage = "https://github.com/shamitv/LLMVoicePOC1"

[tool.setuptools.packages.find]
where = ["src"]
